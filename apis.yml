aid: leona
name: Leona
description: 'Leona is a healthcare communication company building an AI co-pilot for doctors
  and medical teams who run their practices over WhatsApp. Patients keep messaging WhatsApp
  as they always have, while the clinician side moves into Leona, where work conversations
  are separated from personal ones, categorized and prioritized, summarized for context,
  and voice notes are transcribed. Teams delegate chats by role, keep internal notes on a
  patient that the patient never sees, and reuse templates for repeated answers. Founded by
  Caroline Merin (CEO, formerly COO at Rappi), Tom Chokel (CTO, formerly CTO at Modern
  Fertility) and Arela Solis (Head of Operations), Leona launched publicly in December 2025
  and serves physicians across Latin America. It ships as iOS, Android and web clients and
  publishes no public developer API, SDKs or developer portal.'
